name: build
on: 
  push:
    branches: 
    - master
    - dev
  pull_request:
    branches:
    - master

env:
  POETRY_VERSION: "1.3.1"

jobs:
  test-on-linux:
    runs-on: 
    - ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        python-version: [3.7, 3.8]
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Set up Poetry ${{ env.POETRY_VERSION }} with Python ${{ matrix.python-version }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install poetry
      # see https://github.com/marketplace/actions/setup-poetry
      uses: Gr1N/setup-poetry@09236184f6c1ab47c0dc9c1001c7fe200cf2afb0 # v7
      with:
        poetry-version: ${{ env.POETRY_VERSION }}
    - name: Install dependencies
      run: poetry install --no-root
    - name: Build wheel
      run: poetry build --format wheel
    - name: Install Gerapy
      run: pip install dist/gerapy-*.whl
    - name: Run Gerapy
      env:
        PATH: "/root/.local/bin:$PATH"
      run: |
        gerapy -v
        gerapy init
        cd gerapy
        gerapy migrate
        gerapy initadmin
